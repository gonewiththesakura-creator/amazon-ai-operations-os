[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "amazon-ai-api"
version = "0.1.0"
description = "Jarvis runtime API for the Amazon AI operating system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "pytest-asyncio>=0.25,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_ai_api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
