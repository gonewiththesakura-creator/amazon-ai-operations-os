name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  m1-vertical-slice:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amazon_ai_ops
          POSTGRES_USER: amazon_ai_admin
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amazon_ai_admin -d amazon_ai_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://amazon_ai_admin:ci-only-password@127.0.0.1:5432/amazon_ai_ops
      TEST_DATABASE_URL: postgresql://amazon_ai_admin:ci-only-password@127.0.0.1:5432/amazon_ai_ops
      APP_DATA_MODE: SYNTHETIC
      BUSINESS_TIMEZONE: America/Los_Angeles
      OPENAI_ENABLED: "false"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_DEMO_TENANT_ID: 00000000-0000-0000-0000-000000000001

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations
        env:
          PGPASSWORD: ci-only-password
        run: |
          for migration in infra/postgres/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U amazon_ai_admin -d amazon_ai_ops -f "$migration"
          done

      - name: Install backend dependencies
        run: uv sync --project apps/api --extra dev --frozen

      - name: Seed synthetic PostgreSQL workspace
        run: uv run --project apps/api python scripts/seed_synthetic.py --output-dir synthetic-output --load-postgres

      - name: Backend tests
        run: uv run --project apps/api pytest apps/api/tests

      - name: Migration and security contract tests
        run: uv run --project apps/api python -m unittest discover -s infra/tests -v

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Frontend typecheck
        run: npm run typecheck --prefix apps/web

      - name: Frontend tests
        run: npm run test --prefix apps/web

      - name: Frontend production build
        run: npm run build --prefix apps/web
